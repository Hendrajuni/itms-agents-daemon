[package]
name = "itms-agents-daemon"
version = "0.2.3"
edition = "2021"
authors = ["ITMS Engineering Team"]
description = "ITMS Endpoint Telemetry Agent Daemon for Windows"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Windows Native APIs & Service Wrapper
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Etw",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security"
] }

# Local Storage / Offline Buffer
rusqlite = { version = "0.31", features = ["bundled"] }

# System Telemetry & Utilities
sysinfo = "0.30"
mac_address = "1.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
